<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jerrel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0d0d0d;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 20px;
        }

        .header h1 {
            font-size: 2rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 700;
        }

        img {
            width: 100%;
            max-width: 300px;
            border-radius: 8px;
            object-fit: cover;
        }

        .statement p {
            font-size: 0.95rem;
            color: #cccccc;
            line-height: 1.5;
            padding: 0 10px;
        }

        .gateway {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 10px;
        }

        .gateway input {
            width: 100%;
            padding: 14px;
            background: #1a1a1a;
            border: 1px solid #333333;
            border-radius: 6px;
            color: #ffffff;
            font-size: 0.9rem;
            outline: none;
        }

        .gateway input::placeholder {
            color: #666666;
        }

        .gateway button {
            width: 100%;
            padding: 14px;
            background: #ffffff;
            color: #000000;
            border: none;
            border-radius: 6px;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            text-transform: uppercase;
        }

        video {
            width: 100%;
            border-radius: 8px;
            margin-top: 10px;
        }

        #mute-btn {
            background: transparent;
            border: 1px solid #ffffff;
            color: #ffffff;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 0.8rem;
            letter-spacing: 1px;
            cursor: pointer;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Jerrel</h1>
    </div>

    <!-- Your Photo -->
    <img src="F286572B-072A-45C2-BDD3-48B301B15CBE.png" alt="Profile Photo">

    <!-- Bio / Statement -->
    <div class="statement">
        <p>If you have the confidence to step into my space, state who you are.</p>
    </div>

  [https://formsubmit.co/jerreldalton@gmail.com](https://formsubmit.co/myemail@gmail.com)

    <!-- Intro Video -->
    <video autoplay loop muted playsinline id="intro-video">
        <source src="intro.MP4" type="video/mp4">
    </video>
    
    <!-- Audio Toggle Button -->
    <button id="mute-btn" onclick="toggleAudio()">🔊 UNMUTE</button>
</div>

<!-- Audio Toggle Script -->
<script>
  function toggleAudio() {
    var video = document.getElementById("intro-video");
    var btn = document.getElementById("mute-btn");
    
    if (video.muted) {
      video.muted = false;
      btn.innerText = "🔇 MUTE";
    } else {
      video.muted = true;
      btn.innerText = "🔊 UNMUTE";
    }
  }
</script>

</body>
</html>
